  <link rel="icon" href="assets/favicon.ico" sizes="any" />

<body>
  <main class="app" id="app">
    <!-- INICIO -->
    <section class="splash" id="splash" aria-label="Inicio">
      <div class="splash__overlay" aria-hidden="true"></div>

      <div class="splash__content">
        <img class="splash__logo" src="assets/logofondo.png" alt="Helados Tesbita" width="420" height="420" />

        <button class="btn btn--primary splash__btn" id="startBtn" type="button">
          Ver catálogo
        </button>
      </div>
    </section>

    <!-- CARRUSEL (el JS agrega flechas, puntos y la región para lectores de pantalla) -->
    <section class="stories is-hidden" id="stories" aria-label="Menú de helados">
      <div class="stories__track" id="track"></div>
      <div class="dots" id="dots"></div>
    </section>
  </main>

  <noscript>
    <p style="padding:24px;text-align:center">
      Para ver el catálogo active JavaScript o escríbanos por
      <a href="https://wa.me/50662943981">WhatsApp</a>.
